name: insight
description: A Flutter App to help blind people

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.10.5+7
  google_ml_vision: ^0.0.7
  path_provider: ^2.1.2
  tflite_flutter: ^0.11.0
  image: ^4.1.7
  local_auth: ^2.1.8
  flutter_tts: ^3.7.0
  speech_to_text: ^6.4.0
  tflite: ^1.1.3
  intl: ^0.19.0
  receive_sharing_intent: ^1.4.5
  http: ^0.13.6
  geolocator: ^11.0.0
  translator: ^0.1.7
  agora_rtc_engine: ^6.2.6
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.6
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/eye.png"
